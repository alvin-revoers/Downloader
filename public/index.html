<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloadify</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>⬇ Downloadify</h1>
      <p>Download video & gambar dari TikTok, Instagram, YouTube, Facebook</p>
    </header>
    
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Tempel URL di sini..." />
      <button id="downloadBtn">Download</button>
    </div>

    <div id="result"></div>

    <footer>
      <p>© 2026 Downloadify</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
